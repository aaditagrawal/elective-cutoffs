<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="mainBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="secBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- App-like rounded square background with a subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="115" fill="url(#bg)" stroke="#27272a" stroke-width="8" />
  
  <!-- The bars representing data points / electives -->
  <rect x="118" y="260" width="76" height="140" rx="20" fill="url(#secBar)" />
  <rect x="218" y="140" width="76" height="260" rx="20" fill="url(#mainBar)" />
  <rect x="318" y="220" width="76" height="180" rx="20" fill="url(#secBar)" />
  
  <!-- The 'cutoff' line crossing the bars -->
  <line x1="78" y1="190" x2="434" y2="190" stroke="url(#lineGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="32 24" />
</svg>